[workspace]
members = [
  "platuned/server",
  "platuned/client/rust",
  "libplatune/player",
  "libplatune/management",
  "platune-tray",
]
resolver = "3"

[workspace.dependencies]
axum = "0.8.9"
clap = "4.6.6"
console-subscriber = "0.5.0"
daemon-slayer = { git = "https://github.com/aschey/daemon-slayer", rev = "f9a2db29978c79df12517d9850ba8ec21c924835" }
decal = { git = "https://github.com/aschey/decal", rev = "6bccfb8b04c52966d33c2fa87e0c491ea3df8aa8" }
youtube_dl = { git = "https://github.com/aschey/youtube-dl-rs", rev = "9dbce3919b1f386fa8abe6c195f4ab4cb261523f" }
slite = { git = "https://github.com/aschey/slite", rev = "266a2ce37be237b0df3b5faaa1e6dc5ba5d13f4c", default-features = false }
background-service = { git = "https://github.com/aschey/background-service-rs", rev = "e932670ce7998022d8cf56a593f2e39c3c0362b5" }
hls_client = { git = "https://github.com/aschey/hls_client_rs", rev = "4c0b0f9f4e2636c3edc9c71eb338eeff5b296222", default-features = false }
directories = "6.0.0"
dotenvy = "0.15.7"
futures = "0.3.34"
futures-util = "0.3.34"
tipsy = "0.7.0"
prost = "0.14.4"
prost-types = "0.14.4"
rcgen = "0.14.9"
hyper-util = "0.1.20"
time = "0.3.55"
tokio = "1.53.1"
tokio-util = "0.7.19"
tokio-stream = "0.1.19"
tonic = "0.14"
tonic-build = "0.14"
tonic-health = "0.14"
tonic-reflection = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = "0.5.3"
tower-http = "0.7.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2.5"
uuid = "1.24.1"
vergen-gix = "10.0.2"
console = "0.16.4"
which = "8.0.5"
urlencoding = "2.1.3"
auto-launch = "0.6.0"
souvlaki = { version = "0.8.3", default-features = false }
global-hotkey = "0.8.0"
concread = { version = "0.5.10", default-features = false }
eyre = "0.6.14"
ignore = "0.4.33"
itertools = "0.15.0"
log = "0.4.33"
normpath = "1.5.1"
notify = { version = "8.2.0", default-features = false }
num_cpus = "1.17.0"
regex = "1.13.1"
rust-embed = "8.12.0"
sqlx = { version = "0.8", default-features = false }
strum = "0.28.0"
tap = "1.0.1"
thiserror = "2.0.20"
walkdir = "2.5.0"
async-trait = "0.1.92"
flume = "0.12.0"
lazy-regex = "3.6.1"
reqwest = { version = "0.13.4", default-features = false }
reqwest-middleware = "0.5.2"
reqwest-retry = "0.9.1"
stream-download = "0.24.3"
lofty = "0.25.1"
icy-metadata = "0.6.0"
pls = "0.2.3"

# testing dependencies
criterion = "0.8.2"
assert_matches = "1.5.0"
rstest = "0.26.1"
pretty_assertions = "1.4.1"
tempfile = "3.27.0"
spin_sleep = "1.3.3"
