[workspace]
members = [
  "platuned/server",
  "platuned/client/rust",
  "libplatune/player",
  "libplatune/management",
  "platune-tray",
]
resolver = "3"

[workspace.dependencies]
axum = "0.8.9"
clap = "4.6.7"
console-subscriber = "0.5.0"
daemon-slayer = { git = "https://github.com/aschey/daemon-slayer", rev = "70cde22ecd81632c88bc0ee41ccc2d16ec82bb45" }
decal = { git = "https://github.com/aschey/decal", rev = "743b6f2921f5d0eab9b8c053122177c040b1820e" }
youtube_dl = { git = "https://github.com/aschey/youtube-dl-rs", rev = "9dbce3919b1f386fa8abe6c195f4ab4cb261523f" }
slite = { git = "https://github.com/aschey/slite", rev = "c5c72ec4e3de229412e2f5303b749c18fed37dc8", default-features = false }
background-service = { git = "https://github.com/aschey/background-service-rs", rev = "e932670ce7998022d8cf56a593f2e39c3c0362b5" }
hls_client = { git = "https://github.com/aschey/hls_client_rs", rev = "4c0b0f9f4e2636c3edc9c71eb338eeff5b296222", default-features = false }
directories = "6.0.0"
dotenvy = "0.15.7"
futures = "0.3.34"
futures-util = "0.3.34"
tipsy = "0.7.1"
prost = "0.14.4"
prost-types = "0.14.4"
rcgen = "0.14.10"
hyper-util = "0.1.21"
time = "0.3.55"
tokio = "1.54.1"
tokio-util = "0.7.20"
tokio-stream = "0.1.19"
tonic = "0.14"
tonic-build = "0.14"
tonic-health = "0.14"
tonic-reflection = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = "0.5.3"
tower-http = "0.7.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2.5"
uuid = "1.29.0"
vergen-gix = "10.0.3"
console = "0.16.6"
which = "8.0.6"
urlencoding = "2.1.3"
auto-launch = "0.6.0"
souvlaki = { version = "0.9.3", default-features = false }
global-hotkey = "0.9.0"
concread = { version = "0.5.10", default-features = false }
eyre = "0.6.14"
ignore = "0.4.34"
itertools = "0.15.0"
log = "0.4.34"
normpath = "1.5.2"
notify = { version = "8.2.1", default-features = false }
num_cpus = "1.17.0"
regex = "1.13.1"
rust-embed = "8.13.0"
sqlx = { version = "0.9", default-features = false }
strum = "0.28.0"
tap = "1.0.1"
thiserror = "2.0.21"
walkdir = "2.5.0"
async-trait = "0.1.92"
flume = "0.12.0"
lazy-regex = "3.6.2"
reqwest = { version = "0.13.5", default-features = false }
reqwest-middleware = "0.5.2"
reqwest-retry = "0.9.1"
stream-download = "0.24.5"
lofty = "0.25.5"
icy-metadata = "0.6.0"
pls = "0.2.3"

# testing dependencies
criterion = "0.8.2"
assert_matches = "1.5.0"
rstest = "0.28.0"
pretty_assertions = "1.4.1"
tempfile = "3.27.0"
spin_sleep = "1.3.3"
